name: Validate setup package

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test setup repository
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover tests
      - name: Test sermon helper scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover
          plugins/sermon-slide-builder/skills/create-sermon-slides/tests
      - name: Validate plugin and skill package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_package.py
      - name: Parse the read-only environment report
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/check_environment.py --json
